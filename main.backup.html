<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORCE OF THE HORSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
                   DESIGN SYSTEM（変更なし）
                ============================================================ */
        :root {
            --color-bg-primary: #0d1117;
            --color-bg-secondary: #161b22;
            --color-bg-card: rgba(22, 27, 34, 0.85);
            --color-bg-card-hover: rgba(33, 38, 48, 0.95);
            --color-border: rgba(48, 54, 61, 0.8);
            --color-border-hover: rgba(88, 166, 255, 0.5);
            --color-accent: #58a6ff;
            --color-accent-dark: #1f6feb;
            --color-accent-dim: rgba(88, 166, 255, 0.1);
            --color-gold: #ffd700;
            --color-gold-dark: #b8860b;
            --color-gold-dim: rgba(255, 215, 0, 0.15);
            --color-text-primary: #e6edf3;
            --color-text-secondary: #8b949e;
            --color-text-muted: #6e7681;
            --color-easy: #3fb950;
            --color-normal: #d29922;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 44px;
            --font-brand: 'Segoe UI', 'Roboto', sans-serif;
            --font-body: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.1);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
                   RESET & BASE
                ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: var(--color-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
                   APP CONTAINER
                ============================================================ */
        .app {
            position: relative;
            width: 100%;
            max-width: 1440px;
            height: 92vh;
            max-height: 920px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--color-bg-secondary);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(48, 54, 61, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeInUp 0.8s ease-out;
        }

        /* ============================================================
                   BACKGROUND LAYER
                ============================================================ */
        .bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('background.png');
            background-size: cover;
            background-position: center 28%;
            background-repeat: no-repeat;
            z-index: 0;
        }
        .bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(10, 12, 20, 0.85) 0%,
                    rgba(10, 12, 20, 0.65) 40%,
                    rgba(10, 12, 20, 0.50) 70%,
                    rgba(10, 12, 20, 0.75) 100%);
            z-index: 1;
        }

        /* ============================================================
                   FLOATING CARDS（デスクトップ用の配置）
                ============================================================ */
        .floating-cards {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        .float-card {
            position: absolute;
            width: 240px;
            height: 336px;
            border-radius: var(--radius-sm);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(88, 166, 255, 0.2);
            will-change: transform, opacity;
            border: 1px solid rgba(88, 166, 255, 0.3);
            transform-origin: center;
            backface-visibility: hidden;
        }

        /* 各カードの位置・画像・アニメーション（デスクトップ） */
        .float-card:nth-child(1) {
            left: 2%;
            top: 5%;
            animation: float1 11s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            background-image: url('518NoEv5KrL.jpg');
            opacity: 0.45;
        }
        .float-card:nth-child(2) {
            right: 3%;
            top: 8%;
            animation: float2 17s infinite alternate cubic-bezier(0.3, 0, 0.7, 1);
            background-image: url('61HsaJIMLsL._AC_UF894,1000_QL80_.jpg');
            opacity: 0.5;
        }
        .float-card:nth-child(3) {
            left: 5%;
            bottom: 10%;
            animation: float3 9s infinite alternate-reverse cubic-bezier(0.5, 0, 0.5, 1);
            background-image: url('61OqIgWDonL.jpg');
            opacity: 0.4;
        }
        .float-card:nth-child(4) {
            right: 5%;
            bottom: 8%;
            animation: float4 19s infinite alternate cubic-bezier(0.6, 0, 0.4, 1);
            background-image: url('shopping.webp');
            opacity: 0.55;
        }
        .float-card:nth-child(5) {
            left: 45%;
            top: 2%;
            animation: float5 14s infinite alternate cubic-bezier(0.2, 0, 0.8, 1);
            background-image: url('61OqIgWDonL.jpg');
            border-color: var(--color-accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(88, 166, 255, 0.4), 0 0 20px rgba(88, 166, 255, 0.2);
            opacity: 0.6;
        }
        .float-card:nth-child(6) {
            left: 35%;
            bottom: 3%;
            animation: float6 13s infinite alternate-reverse cubic-bezier(0.7, 0, 0.3, 1);
            opacity: 0.25;
            background-image: url('518NoEv5KrL.jpg');
        }
        .float-card:nth-child(7) {
            left: 20%;
            top: 35%;
            animation: float7 16s infinite alternate-reverse cubic-bezier(0.4, 0, 0.6, 1);
            background-image: url('card-images.jpg');
            opacity: 0.35;
        }
        .float-card:nth-child(8) {
            right: 15%;
            top: 40%;
            animation: float8 12s infinite alternate cubic-bezier(0.3, 0, 0.7, 1);
            background-image: url('foth1_0011.jpg');
            opacity: 0.48;
        }
        .float-card:nth-child(9) {
            left: 8%;
            bottom: 35%;
            animation: float9 18s infinite alternate cubic-bezier(0.5, 0, 0.5, 1);
            background-image: url('61HsaJIMLsL._AC_UF894,1000_QL80_.jpg');
            opacity: 0.42;
        }
        .float-card:nth-child(10) {
            right: 10%;
            top: 55%;
            animation: float10 15s infinite alternate-reverse cubic-bezier(0.6, 0, 0.4, 1);
            background-image: url('card-images.jpg');
            opacity: 0.38;
        }

        /* ============================================================
                   アニメーションキーフレーム（変更なし）
                ============================================================ */
        @keyframes float1 {
            0% { transform: translate(0,0) rotate(-6deg) scale(1) rotateX(0deg); }
            50% { transform: translate(60px,-40px) rotate(2deg) scale(1.02) rotateX(5deg); }
            100% { transform: translate(120px,-80px) rotate(10deg) scale(1.04) rotateX(0deg); }
        }
        @keyframes float2 {
            0% { transform: translate(0,0) rotate(12deg) scale(1) rotateY(0deg); }
            33% { transform: translate(-30px,40px) rotate(5deg) scale(0.98) rotateY(8deg); }
            66% { transform: translate(-70px,80px) rotate(-2deg) scale(0.97) rotateY(-5deg); }
            100% { transform: translate(-100px,120px) rotate(-8deg) scale(0.96) rotateY(0deg); }
        }
        @keyframes float3 {
            0% { transform: translate(0,0) rotate(-4deg) scale(1) rotateZ(0deg); }
            25% { transform: translate(-40px,-15px) rotate(5deg) scale(1.03) rotateZ(3deg); }
            75% { transform: translate(-110px,-45px) rotate(12deg) scale(1.06) rotateZ(-2deg); }
            100% { transform: translate(-150px,-60px) rotate(18deg) scale(1.08) rotateZ(0deg); }
        }
        @keyframes float4 {
            0% { transform: translate(0,0) rotate(8deg) scale(1) rotateX(0deg) rotateY(0deg); }
            40% { transform: translate(60px,40px) rotate(0deg) scale(0.96) rotateX(3deg) rotateY(-2deg); }
            100% { transform: translate(140px,100px) rotate(-12deg) scale(0.92) rotateX(0deg) rotateY(0deg); }
        }
        @keyframes float5 {
            0% { transform: translate(0,0) rotate(0deg) scale(1) rotateX(0deg); }
            30% { transform: translate(-25px,-50px) rotate(8deg) scale(1.03) rotateX(5deg); }
            70% { transform: translate(-55px,-110px) rotate(15deg) scale(1.05) rotateX(-3deg); }
            100% { transform: translate(-80px,-160px) rotate(22deg) scale(1.06) rotateX(0deg); }
        }
        @keyframes float6 {
            0% { transform: translate(0,0) rotate(-10deg) scale(1) rotateY(0deg); }
            50% { transform: translate(50px,40px) rotate(-2deg) scale(1.01) rotateY(6deg); }
            100% { transform: translate(100px,80px) rotate(6deg) scale(1.02) rotateY(0deg); }
        }
        @keyframes float7 {
            0% { transform: translate(0,0) rotate(15deg) scale(1) rotateX(0deg) rotateZ(0deg); }
            33% { transform: translate(-20px,-30px) rotate(8deg) scale(1.02) rotateX(4deg) rotateZ(-2deg); }
            66% { transform: translate(-40px,-60px) rotate(2deg) scale(1.04) rotateX(-2deg) rotateZ(3deg); }
            100% { transform: translate(-60px,-90px) rotate(-5deg) scale(1.05) rotateX(0deg) rotateZ(0deg); }
        }
        @keyframes float8 {
            0% { transform: translate(0,0) rotate(-8deg) scale(1) rotateY(0deg); }
            25% { transform: translate(20px,18px) rotate(0deg) scale(0.97) rotateY(5deg); }
            75% { transform: translate(60px,52px) rotate(12deg) scale(0.94) rotateY(-3deg); }
            100% { transform: translate(80px,70px) rotate(20deg) scale(0.95) rotateY(0deg); }
        }
        @keyframes float9 {
            0% { transform: translate(0,0) rotate(3deg) scale(1) rotateX(0deg) rotateY(0deg); }
            40% { transform: translate(-50px,20px) rotate(-5deg) scale(1.01) rotateX(3deg) rotateY(-4deg); }
            100% { transform: translate(-130px,50px) rotate(-15deg) scale(1.03) rotateX(0deg) rotateY(0deg); }
        }
        @keyframes float10 {
            0% { transform: translate(0,0) rotate(-12deg) scale(1) rotateZ(0deg); }
            50% { transform: translate(25px,-55px) rotate(-2deg) scale(0.98) rotateZ(4deg); }
            100% { transform: translate(50px,-110px) rotate(8deg) scale(0.97) rotateZ(0deg); }
        }

        /* ============================================================
                   CONTENT（変更なし）
                ============================================================ */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: var(--space-xl) var(--space-2xl);
            display: flex;
            flex-direction: column;
        }
        .content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
            opacity: 0.3;
        }

        /* ============================================================
                   HEADER
                ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            animation: slideInLeft 0.6s ease-out;
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: var(--space-md);
        }
        .brand .logo {
            font-family: var(--font-brand);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .brand .logo-sub {
            font-size: 0.7rem;
            color: var(--color-gold);
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px var(--space-md);
            border-radius: var(--radius-full);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-inset);
            animation: slideInRight 0.6s ease-out 0.3s backwards;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .user-info .name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--color-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* ============================================================
                   MAIN GRID
                ============================================================ */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-lg);
            flex: 1;
            align-content: center;
            justify-content: center;
            padding: var(--space-xl) 0 var(--space-lg);
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
            max-width: 400px;
            margin: 0 auto;
        }
        .menu-card {
            background: linear-gradient(145deg, rgba(30, 35, 45, 0.95), rgba(20, 25, 35, 0.9));
            backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            padding: var(--space-xl) var(--space-lg);
            border: 1px solid rgba(75, 85, 99, 0.4);
            transition: all var(--transition-base);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 160px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
        }
        .menu-card:nth-child(1) { animation-delay: 0.3s; }
        .menu-card:nth-child(2) { animation-delay: 0.4s; }
        .menu-card:nth-child(3) { animation-delay: 0.5s; }
        .menu-card:nth-child(4) { animation-delay: 0.6s; }
        .menu-card:nth-child(5) { animation-delay: 0.7s; }
        .menu-card:nth-child(6) { animation-delay: 0.8s; }

        .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 20% 80%, rgba(88,166,255,0.03) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(88,166,255,0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        .menu-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(88,166,255,0.3), transparent);
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        .menu-card:hover::after { opacity: 1; }
        .menu-card:hover {
            transform: translateY(-6px);
            border-color: rgba(88,166,255,0.5);
            background: linear-gradient(145deg, rgba(35,40,50,0.98), rgba(25,30,40,0.95));
            box-shadow: 0 8px 16px rgba(0,0,0,0.4), 0 20px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(88,166,255,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .menu-card:active {
            transform: translateY(-2px);
            transition-duration: 0.1s;
        }
        .menu-card.tutorial-card {
            min-height: 220px;
            padding: var(--space-2xl) var(--space-xl);
            border: 3px solid var(--color-accent);
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.2) 0%, rgba(31, 111, 235, 0.3) 50%, rgba(88, 166, 255, 0.2) 100%);
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.5), 0 0 60px rgba(88, 166, 255, 0.3), 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(88, 166, 255, 0.1);
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .menu-card.tutorial-card::before {
            background: radial-gradient(circle at 50% 50%, rgba(88, 166, 255, 0.15) 0%, transparent 70%);
        }
        .menu-card.tutorial-card .icon {
            font-size: 4rem;
            margin-bottom: var(--space-md);
            filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.8));
            animation: icon-float 3s ease-in-out infinite;
        }
        .menu-card.tutorial-card .title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.8), 0 0 40px rgba(88, 166, 255, 0.4);
            background: linear-gradient(135deg, #ffffff 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .menu-card.tutorial-card .desc {
            font-size: 1rem;
            margin-top: var(--space-md);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-accent);
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.6);
        }
        .menu-card.tutorial-card:hover {
            transform: translateY(-12px) scale(1.05);
            border-color: #ffffff;
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.3) 0%, rgba(31, 111, 235, 0.4) 50%, rgba(88, 166, 255, 0.3) 100%);
            box-shadow: 0 0 50px rgba(88, 166, 255, 0.8), 0 0 100px rgba(88, 166, 255, 0.5), 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(88, 166, 255, 0.2);
        }
        .menu-card.tutorial-card:hover .icon {
            filter: drop-shadow(0 0 20px rgba(88, 166, 255, 1));
            transform: scale(1.1);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px rgba(88, 166, 255, 0.5), 0 0 60px rgba(88, 166, 255, 0.3), 0 20px 40px rgba(0, 0, 0, 0.6); }
            50% { box-shadow: 0 0 50px rgba(88, 166, 255, 0.7), 0 0 100px rgba(88, 166, 255, 0.4), 0 20px 40px rgba(0, 0, 0, 0.6); }
        }
        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .menu-card .icon {
            font-size: 2.4rem;
            margin-bottom: var(--space-sm);
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            position: relative;
            z-index: 1;
        }
        .menu-card .icon-img {
            width: 60px;
            height: 84px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: var(--space-sm);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(88,166,255,0.3);
            position: relative;
            z-index: 1;
        }
        .menu-card .title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--color-text-primary);
            letter-spacing: -0.4px;
            position: relative;
            z-index: 1;
        }
        .menu-card .desc {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: 6px;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }
        .menu-card.cpu-card {
            min-height: 190px;
            background: rgba(13,17,23,0.9);
            border-color: rgba(88,166,255,0.15);
        }
        .menu-card.cpu-card:hover {
            border-color: rgba(88,166,255,0.4);
        }
        .difficulty-group {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            width: 100%;
            justify-content: center;
        }
        .diff-btn {
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: rgba(22,27,34,0.6);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            flex: 1;
            min-width: 60px;
            text-align: center;
            white-space: nowrap;
            font-family: var(--font-body);
            line-height: 1.4;
        }
        .diff-btn .diff-icon { margin-right: 2px; }
        .diff-btn:hover {
            transform: translateY(-1px);
            background: rgba(33,38,48,0.8);
            color: var(--color-text-primary);
            border-color: var(--color-border-hover);
        }
        .diff-btn:active { transform: translateY(0); }
        .diff-btn.easy:hover {
            border-color: var(--color-easy);
            color: var(--color-easy);
            background: rgba(63,185,80,0.15);
            box-shadow: 0 0 12px rgba(63,185,80,0.2);
        }
        .diff-btn.normal:hover {
            border-color: var(--color-normal);
            color: var(--color-normal);
            background: rgba(210,153,34,0.15);
            box-shadow: 0 0 12px rgba(210,153,34,0.2);
        }
        .menu-card.secondary {
            min-height: 140px;
            background: linear-gradient(145deg, rgba(20,25,35,0.85), rgba(15,20,30,0.8));
            border-color: rgba(48,54,61,0.5);
        }
        .menu-card.secondary:hover {
            border-color: rgba(88,166,255,0.4);
            background: linear-gradient(145deg, rgba(25,30,40,0.9), rgba(20,25,35,0.85));
        }
        .menu-card.secondary .icon { font-size: 1.9rem; }
        .menu-card.secondary .icon-img { width: 50px; height: 70px; }
        .menu-card.secondary .title { font-size: 0.95rem; font-weight: 600; }

        /* ============================================================
                   FOOTER
                ============================================================ */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--space-md);
            border-top: 1px solid var(--color-border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: var(--space-sm);
            animation: fadeInUp 0.6s ease-out 0.6s backwards;
        }
        .footer-links {
            display: flex;
            gap: var(--space-lg);
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--color-text-muted);
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 4px 0;
            border-bottom: 1px solid transparent;
            font-weight: 500;
            display: inline-block;
        }
        .footer-links a:hover {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent-dim);
            transform: translateY(-1px);
        }
        .footer-status {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }
        .footer-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-accent);
            margin-right: 4px;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ============================================================
                   RESPONSIVE — 浮遊カードの間隔をさらに 2px 広げる
                ============================================================ */
        @media (max-width: 1200px) {
            .content { padding: var(--space-lg) var(--space-xl); }
            .main-grid { gap: var(--space-md); }
            .menu-card { min-height: 140px; padding: var(--space-lg) var(--space-md); }
            .menu-card.cpu-card { min-height: 170px; }
            .menu-card.secondary { min-height: 120px; }
            .float-card { width: 180px; height: 252px; }
            .float-card:nth-child(2) { width: 200px; height: 280px; }
            .float-card:nth-child(5) { width: 220px; height: 308px; }
        }

        @media (max-width: 992px) {
            .float-card {
                display: block;
                width: 140px;
                height: 196px;
                opacity: 0.5;
            }
            .float-card:nth-child(n+7) {
                display: none;
            }
            .brand .logo-sub { display: none; }
            .main-grid {
                grid-template-columns: 1fr;
                gap: var(--space-md);
                max-width: 350px;
            }
            .menu-card { min-height: 180px; padding: var(--space-xl) var(--space-lg); }
            .menu-card.tutorial-card { min-height: 180px; }
            .menu-card.tutorial-card .icon { font-size: 2.5rem; }
            .menu-card.tutorial-card .title { font-size: 1.1rem; }
            .menu-card.tutorial-card .desc { font-size: 0.85rem; }
        }

        @media (max-width: 768px) {
            /* ---- カードサイズと表示枚数（6枚）はそのまま ---- */
            .float-card {
                width: 120px;
                height: 168px;
                opacity: 0.45;
            }
            .float-card:nth-child(n+7) {
                display: none;
            }

            /* ---- 各カードの位置を calc() で 2px 外側に移動 ---- */
            .float-card:nth-child(1) {
                left: calc(1% - 2px);
                top: calc(2% - 2px);
            }
            .float-card:nth-child(2) {
                right: calc(1% - 2px);
                top: calc(3% - 2px);
            }
            .float-card:nth-child(3) {
                left: calc(2% - 2px);
                bottom: calc(4% - 2px);
            }
            .float-card:nth-child(4) {
                right: calc(2% - 2px);
                bottom: calc(3% - 2px);
            }
            .float-card:nth-child(5) {
                left: calc(40% - 2px);
                top: calc(1% - 2px);
            }
            .float-card:nth-child(6) {
                left: calc(30% - 2px);
                bottom: calc(1% - 2px);
            }

            /* ---- その他のレイアウト調整 ---- */
            body { padding: 12px; }
            .app {
                height: 98vh;
                max-height: none;
                border-radius: var(--radius-md);
            }
            .content { padding: var(--space-md); }
            .header {
                flex-wrap: wrap;
                gap: var(--space-sm);
                padding-bottom: var(--space-sm);
            }
            .brand .logo { font-size: 1.4rem; }
            .user-profile { padding: 6px 12px; gap: var(--space-sm); }
            .user-info .name { font-size: 0.8rem; }
            .main-grid {
                grid-template-columns: 1fr;
                gap: var(--space-md);
                max-width: 300px;
                padding: var(--space-md) 0;
            }
            .menu-card {
                min-height: 160px;
                padding: var(--space-xl) var(--space-lg);
                border-radius: var(--radius-sm);
            }
            .menu-card.tutorial-card { min-height: 160px; }
            .menu-card.tutorial-card .icon { font-size: 2.2rem; }
            .menu-card.tutorial-card .title { font-size: 1rem; }
            .menu-card.tutorial-card .desc { font-size: 0.8rem; }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-sm);
                padding-top: var(--space-sm);
            }
            .footer-links { gap: var(--space-md); }
            .footer-links a { font-size: 0.7rem; }
            .footer-status { font-size: 0.65rem; }
        }

        @media (max-width: 420px) {
            /* ---- カードサイズと表示枚数（5枚）はそのまま ---- */
            .float-card {
                width: 90px;
                height: 126px;
                opacity: 0.4;
            }
            .float-card:nth-child(n+6) {
                display: none;
            }

            /* ---- 各カードの位置を calc() で 2px 外側に移動 ---- */
            .float-card:nth-child(1) {
                left: calc(0.5% - 2px);
                top: calc(1% - 2px);
            }
            .float-card:nth-child(2) {
                right: calc(0.5% - 2px);
                top: calc(1% - 2px);
            }
            .float-card:nth-child(3) {
                left: calc(0.5% - 2px);
                bottom: calc(1% - 2px);
            }
            .float-card:nth-child(4) {
                right: calc(0.5% - 2px);
                bottom: calc(1% - 2px);
            }
            .float-card:nth-child(5) {
                left: calc(38% - 2px);
                top: calc(0.5% - 2px);
            }
            .float-card:nth-child(6) {
                left: calc(28% - 2px);
                bottom: calc(0.5% - 2px);
            }

            /* ---- その他のレイアウト調整 ---- */
            .main-grid {
                grid-template-columns: 1fr;
                gap: var(--space-sm);
                max-width: 280px;
            }
            .menu-card {
                min-height: 140px;
                padding: var(--space-lg) var(--space-md);
                border-radius: var(--radius-sm);
            }
            .menu-card.tutorial-card { min-height: 140px; }
            .menu-card.tutorial-card .icon { font-size: 2rem; }
            .menu-card.tutorial-card .title { font-size: 0.95rem; }
            .menu-card.tutorial-card .desc { font-size: 0.75rem; }
            .brand .logo { font-size: 1.2rem; }
            .user-info .name { font-size: 0.7rem; }
        }

        /* ============================================================
                   UTILITY
                ============================================================ */
        .app::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- 背景レイヤー -->
        <div class="bg-layer"></div>

        <!-- 舞うカード -->
        <div class="floating-cards">
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
            <div class="float-card"></div>
        </div>

        <!-- コンテンツ -->
        <div class="content">

            <header class="header">
                <div class="brand">
                    <span class="logo">FORCE</span>
                    <span class="logo-sub">of the Horse</span>
                </div>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="name">ゲストユーザー</span>
                    </div>
                </div>
            </header>

                <div class="menu-card tutorial-card" id="btnTutorial">

                <div class="footer-links">

                    <a>❓ サポート</a>
                    <a>📄 利用規約</a>
                </div>
                <div class="footer-status">
                    <span><span class="dot"></span>オンライン</span>
                    <span>v2.4.1</span>
                </div>
            </footer>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            document.getElementById('btnTutorial').addEventListener('click', () => { window.location.href = 'foth-game/index.html'; });

            document.getElementById('footerOfficial').addEventListener('click', () => { window.location.href = 'https://force-of-the-horse.com/'; });
            document.getElementById('footerCommunity').addEventListener('click', () => { alert('💬 コミュニティページを開きます。\nユーザー同士で情報交換しましょう！'); });
            document.getElementById('footerInfo').addEventListener('click', () => { alert('📋 ゲーム情報\n\nバージョン: 2.4.1\n開発: FORCE STUDIO\nサポート: support@force.com'); });

            document.querySelectorAll('.menu-card, .footer-links a').forEach(el => {
                el.setAttribute('role', 'button');
                el.setAttribute('tabindex', '0');
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        el.click();
                    }
                });
            });

            console.log('✅ FORCE OF THE HORSE — Production UI loaded');
        })();
    </script>
